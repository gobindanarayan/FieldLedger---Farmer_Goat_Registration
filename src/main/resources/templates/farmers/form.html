<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add farmer · FieldLedger</title><link rel="stylesheet" th:href="@{/css/styles.css}"></head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::section})}">
    <section class="form-page">
        <a class="back-link" th:href="@{/farmers}">← Back to farmers</a>
        <div class="form-heading"><span class="eyebrow green-eyebrow">NEW REGISTER ENTRY</span><h1>Register a farmer</h1><p class="muted">Add the farmer's contact and location details.</p></div>
        <form th:action="@{/farmers}" th:object="${farmerForm}" method="post" class="form-card form-stack">
            <div class="field-row"><div class="field"><label for="fullName">Full name <span class="required">*</span></label><input id="fullName" th:field="*{fullName}" placeholder="e.g. Ramesh Kumar" required><small class="field-error" th:errors="*{fullName}"></small></div>
                <div class="field"><label for="phone">Phone number <span class="required">*</span></label><input id="phone" th:field="*{phone}" type="tel" placeholder="e.g. 9876501234" required><small class="field-error" th:errors="*{phone}"></small></div></div>
            <div class="field"><label for="village">Village or town <span class="required">*</span></label><input id="village" th:field="*{village}" placeholder="Village or town" required><small class="field-error" th:errors="*{village}"></small></div>
            <div class="field"><label for="address">Address <span class="optional">OPTIONAL</span></label><textarea id="address" th:field="*{address}" rows="3" placeholder="Street, landmark, or other helpful detail"></textarea><small class="field-error" th:errors="*{address}"></small></div>
            <div class="form-actions"><a class="button button-quiet" th:href="@{/farmers}">Cancel</a><button class="button button-primary" type="submit">Save farmer <span>→</span></button></div>
        </form>
    </section>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
