spring.application.name=farmer-goat-register

# Keep credentials outside the source code. Override these with environment variables when needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/farmer_goat_register?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
#spring.datasource.password=${DB_PASSWORD:your-local-mysql-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA creates or updates tables from the entity classes. For a classroom project this is convenient.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
server.error.include-message=never

# A demo account and example farmers/goats/vaccinations are added to an empty database.
# Set APP_DEMO_DATA_ENABLED=false for a non-demo deployment.
app.demo-data-enabled=${APP_DEMO_DATA_ENABLED:true}
app.demo-username=${APP_DEMO_USERNAME:demo}
app.demo-password=${APP_DEMO_PASSWORD:demo12345}
